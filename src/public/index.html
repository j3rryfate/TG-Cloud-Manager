<!-- src/public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram File Manager</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <h1>File Manager</h1>
    </div>
    <div class="header-right">
      <div class="user-info">
        <span id="user-name">Loading...</span>
        <span id="bot-name" class="bot-badge">@bot</span>
      </div>
      <button class="btn btn-icon" onclick="logout()" title="Logout">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search-input" placeholder="Search files..." oninput="debounceSearch()">
    </div>
    <div class="toolbar-actions">
      <div class="view-toggle">
        <button class="btn btn-icon active" id="btn-grid" onclick="setView('grid')" title="Grid view">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
          </svg>
        </button>
        <button class="btn btn-icon" id="btn-list" onclick="setView('list')" title="List view">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </button>
      </div>
      <select id="filter-type" onchange="filterFiles()">
        <option value="all">All Files</option>
        <option value="photo">Photos</option>
        <option value="video">Videos</option>
        <option value="document">Documents</option>
        <option value="audio">Audio</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="refreshFiles()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Refresh
      </button>
    </div>
  </div>

  <!-- File Stats -->
  <div class="stats-bar">
    <span id="file-count">0 files</span>
    <span id="total-size">0 B</span>
  </div>

  <!-- Files Container -->
  <main class="container">
    <div id="loading" class="loading-state">
      <div class="spinner large"></div>
      <p>Loading files...</p>
    </div>

    <div id="empty-state" class="empty-state" style="display:none;">
      <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
        <polyline points="13 2 13 9 20 9"></polyline>
      </svg>
      <h3>No files found</h3>
      <p>Send files to your bot to see them here</p>
    </div>

    <div id="files-grid" class="files-grid" style="display:none;"></div>
    <div id="files-list" class="files-list" style="display:none;"></div>

    <div id="load-more" class="load-more" style="display:none;">
      <button class="btn btn-secondary" onclick="loadMore()">Load More</button>
    </div>
  </main>

  <!-- File Preview Modal -->
  <div id="preview-modal" class="modal" style="display:none;">
    <div class="modal-overlay" onclick="closePreview()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="preview-title">File Preview</h3>
        <button class="btn btn-icon" onclick="closePreview()">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="preview-body"></div>
      <div class="modal-footer">
        <div class="file-details" id="preview-details"></div>
        <div class="modal-actions">
          <button class="btn btn-primary" id="btn-download-preview" onclick="downloadFromPreview()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download
          </button>
          <button class="btn btn-danger" id="btn-delete-preview" onclick="deleteFromPreview()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="modal" style="display:none;">
    <div class="modal-overlay" onclick="closeDeleteModal()"></div>
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h3>Delete File?</h3>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete <strong id="delete-filename"></strong>?</p>
        <p class="text-muted">This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger" id="btn-confirm-delete" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/js/utils.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
